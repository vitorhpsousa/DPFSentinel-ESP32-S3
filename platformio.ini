; DPF Sentinel — ESP32-S3 OBD logger. One codebase, two boards:
;   pio run -e cyd35      CYD 3.5" ST77922 touchscreen (screen + speaker + SD)
;   pio run -e freenove   Freenove ESP32-S3 WROOM, no screen (SD only; camera unused)
;   pio test -e native    host-side unit tests (decoders, ISO-TP)
[platformio]
default_envs = cyd35

[esp32]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=1
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3

[env:cyd35]
extends = esp32
build_flags = ${esp32.build_flags} -D BOARD_CYD35=1 -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = ${esp32.lib_deps}
    adafruit/Adafruit GFX Library@^1.11.9

; Same board, portrait turned 180 deg (use if the picture is upside down once mounted).
[env:cyd35_flipped]
extends = env:cyd35
build_flags = ${env:cyd35.build_flags} -D BOARD_ROTATION=2

; Same board in landscape (the old layout).
[env:cyd35_landscape]
extends = env:cyd35
build_flags = ${env:cyd35.build_flags} -D BOARD_ROTATION=1

[env:freenove]
extends = esp32
; messages go to the COM/UART socket (the one you flash through), not the native USB socket
build_flags = ${esp32.build_flags} -D BOARD_FREENOVE=1 -D ARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = +<*> -<audio/> -<board/> -<input/> -<ui/>

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
build_src_filter = -<*> +<obd/pid_decode.cpp> +<obd/isotp.cpp>
test_build_src = yes

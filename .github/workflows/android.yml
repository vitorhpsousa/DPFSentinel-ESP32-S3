name: Android app

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml", "logs/examples/**"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml", "logs/examples/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (decoding, regen, health, CSV)
        run: ./gradlew -p core test --console=plain
      - name: Build APK
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Show what Android Auto sees (merged manifest)
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump xmltree --file AndroidManifest.xml app/build/outputs/apk/debug/app-debug.apk \
            | grep -E 'E: (service|meta-data|action|category|intent-filter|uses-sdk|application)|A: android:(name|value|resource|exported|minSdkVersion|targetSdkVersion|debuggable)' \
            | grep -v -E 'permission'
      - uses: actions/upload-artifact@v4
        with:
          name: dpf-sentinel-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

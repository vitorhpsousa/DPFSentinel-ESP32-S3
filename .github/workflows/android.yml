name: Android app

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml", "logs/examples/**"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml", "logs/examples/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (decoding, regen, health, CSV)
        run: ./gradlew -p core test --console=plain
      - name: Signing / Play upload key (from the SIDELOAD_KEYSTORE_B64 secret)
        env:
          KEYSTORE_B64: ${{ secrets.SIDELOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sideload.keystore"
            echo "SIDELOAD_KEYSTORE=$RUNNER_TEMP/sideload.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::SIDELOAD_KEYSTORE_B64 secret not set: no Play bundle, and this APK has a one-off key that won't install over another build"
          fi
      - name: Build APK
        env:
          SIDELOAD_KEYSTORE_PASSWORD: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Show what Android Auto sees (merged manifest)
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump xmltree --file AndroidManifest.xml app/build/outputs/apk/debug/app-debug.apk \
            | grep -E 'E: (service|meta-data|action|category|intent-filter|application)|A: .*android:(name|value|resource|versionName|debuggable)\(' \
            | grep -v -E 'permission|androidx\.(startup|profileinstaller|emoji2|lifecycle)'
      - name: Name the APK after its version
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/DPF-Sentinel-$v.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: dpf-sentinel-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      # The file to upload to Google Play (release, not debuggable, signed with the upload key).
      - name: Build Play bundle
        if: env.SIDELOAD_KEYSTORE != ''
        env:
          SIDELOAD_KEYSTORE_PASSWORD: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease --console=plain
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mv app/build/outputs/bundle/release/app-release.aab "app/build/outputs/bundle/release/DPF-Sentinel-$v.aab"
      - uses: actions/upload-artifact@v4
        if: env.SIDELOAD_KEYSTORE != ''
        with:
          name: dpf-sentinel-play-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
